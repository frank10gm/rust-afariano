[workspace]
resolver = "3"
members = ["crates/proto", "crates/ci", "crates/server", "crates/runner"]

[workspace.package]
version = "0.8.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/frank10gm/rust-afariano"
homepage = "https://github.com/frank10gm/rust-afariano"
authors = ["Francesco La Placa"]
rust-version = "1.88"
publish = false

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
